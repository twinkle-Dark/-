

# 博物館互動式平面圖功能測試清單

## 基本界面功能
- [ ] 平面圖正確加載並顯示
- [ ] 所有點位(hotspot)正確顯示
- [ ] 點位名稱標籤顯示正確
- [ ] 界面在不同設備上自適應顯示(電腦、平板)

## 計時功能
- [ ] 全局計時器正確啟動(點擊第一個點位時)
- [ ] 全局計時器正確計時顯示
- [ ] 點位計時器在點擊點位時啟動
- [ ] 點位計時器正確計時顯示

## 記錄功能
- [ ] 點擊點位正確彈出活動記錄表單
- [ ] 表單中點位ID正確顯示
- [ ] 互動行為複選框正常運作
- [ ] 備註輸入框正常運作
- [ ] 取消按鈕正確關閉表單
- [ ] 儲存按鈕正確保存記錄

## 記錄管理
- [ ] 已記錄的活動列表正確顯示
- [ ] 記錄按時間順序排列(最新的在最前面)
- [ ] 記錄項目顯示完整信息(點位、時間、停留秒數、互動行為、備註)
- [ ] 記錄刪除功能正常運作
- [ ] 刪除確認對話框正常顯示

## 路線圖功能
- [ ] 結束記錄後路線圖正確生成
- [ ] 路線線段正確連接各點位
- [ ] 順序數字正確顯示
- [ ] 路線動畫效果正常

## 操作控制功能
- [ ] 「開始新記錄」按鈕正常運作
- [ ] 「結束記錄」按鈕正常運作
- [ ] 重置確認對話框正常顯示

## 數據授權與訪客信息收集
- [ ] 結束記錄後授權書模態窗正確顯示
- [ ] 「同意」和「不同意」按鈕正常運作
- [ ] 不同意選擇正確清除數據
- [ ] 訪客信息表單正確顯示
- [ ] 表單所有必填項驗證正常
- [ ] 表單數據正確保存

## 數據存儲與同步
- [ ] 記錄數據正確保存到localStorage
- [ ] 頁面刷新後記錄數據仍然存在
- [ ] 訪客信息正確保存到localStorage
- [ ] 數據成功發送到Google Sheet
- [ ] 發送失敗時正確保存到failedSubmission
- [ ] 檢測並提示重新發送失敗的提交

## 通知與反饋
- [ ] Toast提示正確顯示
- [ ] 操作成功提示正確顯示
- [ ] 錯誤提示正確顯示
- [ ] 確認對話框正確顯示

