<script>
console.log('✓ 儀表板模組已成功載入');

/**
 * 儀表板模組 - 負責管理系統儀表板功能
 * 包含數據載入、統計計算與儀表板渲染
 */ // 儀表板模組功能列表
    // 1. 初始化
    // 2. 設置事件監聽
    // 3. 載入篩選器選項
    // 4. 載入儀表板數據
    // 5. 顯示/隱藏載入狀態
    // 6. 渲染儀表板
    // 7. 匯出儀表板報表
    // 8. 啟用拖曳卡片功能

// 定義儀表板模組
const DashboardModule = {
    // 當前篩選設置
    filters: {
        timeRange: 'day',
        museum: '',
        exhibition: ''
    },
    
    // 數據緩存
    dataCache: null,
    
    // 初始化
    init: function() {
        console.log('初始化儀表板模組');
        this.setupEventListeners();
        this.loadFilterOptions();
        this.loadData();
    },
    
    // 設置事件監聽
    setupEventListeners: function() {
        // 時間範圍選擇
        document.querySelectorAll('#timeRangeSelector .btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('#timeRangeSelector .btn').forEach(b => 
                    b.classList.remove('active'));
                e.target.classList.add('active');
                this.filters.timeRange = e.target.getAttribute('data-range');
                this.loadData();
            });
        });
        
        // 重新整理按鈕
        const refreshBtn = document.getElementById('refreshDashboardBtn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', () => this.loadData(true));
        }
        
        // 匯出報表按鈕
        const exportBtn = document.getElementById('exportDashboardBtn');
        if (exportBtn) {
            exportBtn.addEventListener('click', () => this.exportDashboard());
        }
    },
    
    // 載入篩選器選項
    loadFilterOptions: function() {
        // 載入博物館選項
        if (typeof google !== 'undefined' && google.script) {
            google.script.run
                .withSuccessHandler(data => {
                    this.renderMuseumOptions(data);
                })
                .getDataMuseums();
        } else {
            // 測試環境使用模擬數據
            setTimeout(() => {
                const museums = [
                    {id: 'nmp', name: '國立史前文化博物館'}
                ];
                this.renderMuseumOptions(museums);
            }, 300);
        }
    },
    
    // 渲染博物館選項
    renderMuseumOptions: function(museums) {
        // 實現博物館選項渲染邏輯
        console.log('載入博物館選項:', museums);
        
        const selector = document.getElementById('museumSelector');
        if (selector) {
            // 清空現有選項
            selector.innerHTML = '<option value="">所有博物館</option>';
            
            // 添加博物館選項
            museums.forEach(museum => {
                const option = document.createElement('option');
                option.value = museum.id || museum[0];
                option.textContent = museum.name || museum[1] || museum[0];
                selector.appendChild(option);
            });
        }
    },
    
    // 載入儀表板數據
    loadData: function(forceRefresh = false) {
        // 顯示載入指示器
        this.showLoadingState(true);
        
        // 從服務器獲取數據或使用測試數據
        if (typeof google !== 'undefined' && google.script) {
            google.script.run
                .withSuccessHandler(data => {
                    this.dataCache = data;
                    this.renderDashboard(data);
                    this.showLoadingState(false);
                })
                .withFailureHandler(error => {
                    console.error('載入數據失敗:', error);
                    this.showLoadingState(false);
                })
                .getDataVInteractions();
        } else {
            // 測試環境使用模擬數據
            setTimeout(() => {
                // 使用默認值作為後備
                const defaultData = {
                    visitorCount: 25,
                    volunteerCount: 8,
                    recordCount: 142,
                    avgStayTime: 270, // 秒數
                    visitorTrend: [65, 59, 80, 81, 56, 55],
                    popularAreas: [
                        {name: '展區A', count: 120},
                        {name: '展區B', count: 190},
                        {name: '展區C', count: 30},
                        {name: '展區D', count: 50},
                        {name: '展區E', count: 20}
                    ]
                };
                this.dataCache = defaultData;
                this.renderDashboard(defaultData);
                this.showLoadingState(false);
            }, 500);
        }
    },
    
    // 處理訪客互動數據
    processVisitorInteractionsData: function(visitorInteractions) {
        let result = {
            visitorCount: 0,
            volunteerCount: 0,
            recordCount: 0,
            avgStayTime: 0,
            visitorTrend: [0, 0, 0, 0, 0, 0],
            popularAreas: []
        };
        
        if (!visitorInteractions || visitorInteractions.length <= 1) {
            return result; // 返回默認值
        }
        
        // 假設第一行是標題行
        const headers = visitorInteractions[0];
        const recordIdIdx = headers.indexOf('recordId');
        const museumIdIdx = headers.indexOf('museumId');
        const staySecondsIdx = headers.indexOf('staySeconds');
        const exhibitIdIdx = headers.indexOf('exhibitId');
        const exhibitNameIdx = headers.indexOf('exhibitName');
        
        // 如果找不到必要的列，返回默認值
        if (recordIdIdx < 0 || staySecondsIdx < 0) {
            return result;
        }
        
        // 統計數據
        const visitorIds = new Set();
        const volunteerIds = new Set();
        let totalStayTime = 0;
        const areaCountMap = {};
        
        // 從第二行開始遍歷，跳過標題行
        for (let i = 1; i < visitorInteractions.length; i++) {
            const row = visitorInteractions[i];
            if (!row || row.length === 0) continue;
            
            // 記錄總數增加
            result.recordCount++;
            
            // 假設每條記錄有一個訪客ID
            if (row[recordIdIdx]) {
                const visitorId = row[recordIdIdx].split('_')[0];
                if (visitorId) visitorIds.add(visitorId);
            }
            
            // 停留時間（如果有）
            if (row[staySecondsIdx] && !isNaN(parseInt(row[staySecondsIdx]))) {
                totalStayTime += parseInt(row[staySecondsIdx]);
            }
            
            // 熱門區域統計
            const areaName = (exhibitNameIdx >= 0 && row[exhibitNameIdx]) ? 
                row[exhibitNameIdx] : 
                (exhibitIdIdx >= 0 && row[exhibitIdIdx]) ? 
                    row[exhibitIdIdx] : 
                    '未知區域';
            
            areaCountMap[areaName] = (areaCountMap[areaName] || 0) + 1;
        }
        
        // 計算結果
        result.visitorCount = visitorIds.size;
        result.volunteerCount = volunteerIds.size;
        result.avgStayTime = result.recordCount > 0 ? Math.round(totalStayTime / result.recordCount) : 0;
        
        // 轉換熱門區域為數組
        result.popularAreas = Object.entries(areaCountMap)
            .map(([name, count]) => ({ name, count }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 5); // 取前5個最熱門區域
        
        // 隨機生成訪客趨勢數據（實際中應該從數據中計算）
        result.visitorTrend = Array(6).fill(0).map(() => Math.floor(Math.random() * 100) + 20);
        
        return result;
    },
    
    // 顯示/隱藏載入狀態
    showLoadingState: function(isLoading) {
        const cards = document.querySelectorAll('.dashboard-card .card-text');
        cards.forEach(card => {
            if (isLoading) {
                card.dataset.originalText = card.textContent;
                card.innerHTML = '<div class="spinner-border spinner-border-sm text-secondary" role="status"><span class="visually-hidden">Loading...</span></div>';
            } else if (card.dataset.originalText) {
                card.textContent = card.dataset.originalText;
                delete card.dataset.originalText;
            }
        });
    },
    
    // 渲染儀表板
    renderDashboard: function(data) {
        if (!data) return;
        
        // 更新卡片數據
        document.getElementById('visitorCountCard').textContent = data.visitorCount || 0;
        document.getElementById('volunteerCountCard').textContent = data.volunteerCount || 0;
        document.getElementById('recordCountCard').textContent = data.recordCount || 0;
        
        // 格式化平均停留時間（秒轉為分:秒）
        const avgSeconds = data.avgStayTime || 0;
        const minutes = Math.floor(avgSeconds / 60);
        const seconds = avgSeconds % 60;
        document.getElementById('avgStayTimeCard').textContent = 
            `${minutes}:${seconds.toString().padStart(2, '0')}`;
        
        // 更新圖表（如果有）
        this.updateVisitorTrendChart(data.visitorTrend);
        this.updatePopularAreasChart(data.popularAreas);
    },
    
    // 更新訪客趨勢圖表
    updateVisitorTrendChart: function(trendData) {
        const ctx = document.getElementById('visitorTrendChart');
        if (!ctx) return;
        
        // 使用Chart.js更新圖表
        if (window.Chart && trendData) {
            if (ctx.chart) {
                ctx.chart.destroy();
            }
            
            ctx.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['一月', '二月', '三月', '四月', '五月', '六月'],
                    datasets: [{
                        label: '訪客數',
                        data: trendData,
                        fill: true,
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    },
    
    // 更新熱門區域圖表
    updatePopularAreasChart: function(areasData) {
        const ctx = document.getElementById('popularAreasChart');
        if (!ctx) return;
        
        // 使用Chart.js更新圖表
        if (window.Chart && areasData && areasData.length > 0) {
            if (ctx.chart) {
                ctx.chart.destroy();
            }
            
            ctx.chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: areasData.map(area => area.name),
                    datasets: [{
                        label: '記錄數',
                        data: areasData.map(area => area.count),
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.5)',
                            'rgba(54, 162, 235, 0.5)',
                            'rgba(255, 206, 86, 0.5)',
                            'rgba(75, 192, 192, 0.5)',
                            'rgba(153, 102, 255, 0.5)'
                        ],
                        borderColor: [
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
    },
    
    // 匯出儀表板報表
    exportDashboard: function() {
        alert('匯出儀表板報表功能尚未實現');
    }
};

// 導出模組
// 在瀏覽器環境中，將模組附加到全局App對象
if (typeof window !== 'undefined' && window.App) {
    window.App.dashboardModule = DashboardModule;
}

// 在Node.js環境中(測試環境)，將模組導出
if (typeof module !== 'undefined' && module.exports) {
    module.exports = DashboardModule;
} 
</script>
